# OSPF + BGP routing lab with FRRouting.
# Every point-to-point link is its own Docker network so each router sees real
# interfaces and its own routing table. Networks are "internal" (no NAT, no
# traffic to or from the internet) so the lab is fully isolated.

x-router: &router
  image: frrouting/frr:latest@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce
  restart: "no"
  entrypoint: ["/bin/sh", "/frr-entrypoint.sh"]
  cap_add:
    - NET_ADMIN
    - SYS_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.rp_filter=0
    - net.ipv4.conf.default.rp_filter=0

services:
  r1:
    <<: *router
    container_name: r1
    hostname: r1
    volumes:
      - ./configs/r1:/config:ro
      - ./scripts/frr-entrypoint.sh:/frr-entrypoint.sh:ro
    networks:
      link-r1-r2: { ipv4_address: 10.10.12.2 }
      link-r1-r3: { ipv4_address: 10.10.13.2 }
      link-r1-r4: { ipv4_address: 10.10.14.2 }

  r2:
    <<: *router
    container_name: r2
    hostname: r2
    volumes:
      - ./configs/r2:/config:ro
      - ./scripts/frr-entrypoint.sh:/frr-entrypoint.sh:ro
    networks:
      link-r1-r2: { ipv4_address: 10.10.12.3 }
      link-r2-r3: { ipv4_address: 10.10.23.2 }
      lan-a: { ipv4_address: 10.10.100.2 }

  r3:
    <<: *router
    container_name: r3
    hostname: r3
    volumes:
      - ./configs/r3:/config:ro
      - ./scripts/frr-entrypoint.sh:/frr-entrypoint.sh:ro
    networks:
      link-r1-r3: { ipv4_address: 10.10.13.3 }
      link-r2-r3: { ipv4_address: 10.10.23.3 }
      link-r3-r4: { ipv4_address: 10.10.34.2 }

  r4:
    <<: *router
    container_name: r4
    hostname: r4
    volumes:
      - ./configs/r4:/config:ro
      - ./scripts/frr-entrypoint.sh:/frr-entrypoint.sh:ro
    networks:
      link-r1-r4: { ipv4_address: 10.10.14.3 }
      link-r3-r4: { ipv4_address: 10.10.34.3 }
      lan-b: { ipv4_address: 10.10.200.2 }

  host-a:
    image: alpine:3.20
    container_name: host-a
    hostname: host-a
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route replace default via 10.10.100.2 && tail -f /dev/null"
    networks:
      lan-a: { ipv4_address: 10.10.100.10 }

  host-b:
    image: alpine:3.20
    container_name: host-b
    hostname: host-b
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route replace default via 10.10.200.2 && tail -f /dev/null"
    networks:
      lan-b: { ipv4_address: 10.10.200.10 }

networks:
  link-r1-r2:
    internal: true
    ipam: { config: [ { subnet: 10.10.12.0/24 } ] }
  link-r1-r3:
    internal: true
    ipam: { config: [ { subnet: 10.10.13.0/24 } ] }
  link-r1-r4:
    internal: true
    ipam: { config: [ { subnet: 10.10.14.0/24 } ] }
  link-r2-r3:
    internal: true
    ipam: { config: [ { subnet: 10.10.23.0/24 } ] }
  link-r3-r4:
    internal: true
    ipam: { config: [ { subnet: 10.10.34.0/24 } ] }
  lan-a:
    internal: true
    ipam: { config: [ { subnet: 10.10.100.0/24 } ] }
  lan-b:
    internal: true
    ipam: { config: [ { subnet: 10.10.200.0/24 } ] }
