! r3 - AS 65001 edge router, eBGP to r4 (backup path, default local-pref 100)
frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface @IF[10.10.13.3]
 ip ospf network non-broadcast
!
interface @IF[10.10.23.3]
 ip ospf network non-broadcast
!
router ospf
 ospf router-id 3.3.3.3
 neighbor 10.10.13.2 priority 1 poll-interval 10
 neighbor 10.10.23.2 priority 1 poll-interval 10
 network 3.3.3.3/32 area 0
 network 10.10.13.0/24 area 0
 network 10.10.23.0/24 area 0
!
router bgp 65001
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.10.34.3 remote-as 65002
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 update-source lo
 neighbor 2.2.2.2 remote-as 65001
 neighbor 2.2.2.2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 1.1.1.1 next-hop-self
  neighbor 2.2.2.2 next-hop-self
 exit-address-family
!
line vty
!
