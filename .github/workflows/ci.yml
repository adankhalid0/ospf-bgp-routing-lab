name: Lab test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose config -q

      - name: Start the lab
        run: docker compose up -d

      - name: Verify OSPF, BGP and connectivity
        run: bash scripts/verify.sh

      - name: Show routing state
        if: always()
        run: |
          for r in r1 r2 r3; do
            echo "===== $r: OSPF neighbors ====="
            docker compose exec -T "$r" vtysh -c 'show ip ospf neighbor' || true
          done
          for r in r1 r2 r3 r4; do
            echo "===== $r: BGP summary ====="
            docker compose exec -T "$r" vtysh -c 'show ip bgp summary' || true
          done
          echo "===== r2: BGP route to 10.10.200.0/24 (local-pref 200 via r1) ====="
          docker compose exec -T r2 vtysh -c 'show ip bgp 10.10.200.0/24' || true
          echo "===== r4: BGP table ====="
          docker compose exec -T r4 vtysh -c 'show ip bgp' || true

      - name: Failover test
        run: bash scripts/failover.sh

      - name: Router state and logs
        if: always()
        run: |
          docker compose ps
          for r in r1 r2 r3 r4; do
            echo "===== $r ====="
            docker compose logs --no-color --tail 40 "$r" || true
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
